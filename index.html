<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Rain Linktree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --dark: #0f0f0f;
            --card: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.06);
            --online: #22c55e;
        }

        html {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 18px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Orbs */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            will-change: transform;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation: float1 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--secondary);
            top: 20%;
            right: -50px;
            animation: float2 25s ease-in-out infinite;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--accent);
            bottom: 10%;
            left: 10%;
            animation: float3 22s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 50px) scale(0.9); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.05); }
        }

        /* Glass Overlay */
        .glass {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, var(--dark) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--accent), var(--primary));
            animation: spin 10s linear infinite;
            opacity: 0.8;
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f0f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .avatar svg {
            width: 55px;
            height: 55px;
            fill: url(#grad1);
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

               /* Name with Verified Badge di samping (kecil) */
        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .name {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        /* Verified Badge Kecil di Samping Nama */
        .verified-glow {
            position: relative;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .verified-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #06b6d4, #3b82f6);
            opacity: 0.5;
            filter: blur(4px);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .verified-badge {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        .verified-badge svg {
            width: 9px;
            height: 9px;
            fill: white;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), 0 0 25px rgba(6, 182, 212, 0.2); transform: scale(1.05); }
        }


        .handle {
            color: #6366f1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .stat svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Links Container */
        .links {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        /* Premium Link Card */
        .link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, box-shadow;
        }

        .link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .link:hover::before,
        .link:active::before {
            transform: translateX(100%);
        }

        .link:hover,
        .link:active {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.3);
        }

        /* Icon Box */
        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .icon-box::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.9;
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: white;
            position: relative;
            z-index: 1;
        }

        /* WhatsApp - Green */
        .wa .icon-box::before {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        /* Instagram - Sunset */
        .ig .icon-box::before {
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #8b5cf6 100%);
        }

        /* Socialbuzz - Love */
        .socialbuzz .icon-box::before {
            background: linear-gradient(135deg, #f472b6 0%, #db2777 50%, #be185d 100%);
        }

        .socialbuzz .icon-box svg {
            animation: heartbeat 2s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        /* WA Group - Teal */
        .wagroup .icon-box::before {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 50%, #0f766e 100%);
        }
        
        /* Saweria - Coffee Gold */
         .saweria .icon-box::before {
          background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
       }

          .saweria .icon-box svg {
            width: 24px;
            height: 24px;
            fill: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
       }

        /* Gold Badge */
        .badge-gold {
         background: rgba(245, 158, 11, 0.15);
         color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
       }


        /* Content */
        .content {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Online Indicator */
        .online-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--online);
            font-weight: 500;
            background: rgba(34, 197, 94, 0.1);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: var(--online);
            border-radius: 50%;
            position: relative;
        }

        .online-dot::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: var(--online);
            opacity: 0.4;
            animation: onlinePulse 2s ease-in-out infinite;
        }

        @keyframes onlinePulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(2.5); opacity: 0; }
        }

        .desc {
            font-size: 13px;
            color: #666;
        }

        /* Arrow */
        .arrow {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .link:hover .arrow,
        .link:active .arrow {
            background: var(--primary);
            color: white;
            transform: translateX(4px);
        }

        /* Footer Simple Professional */
        .footer {
            margin-top: 60px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .footer-logo {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
        }

        .footer-logo svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .footer-text {
            color: #555;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .footer-copy {
            color: #333;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .footer-line {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            margin: 20px auto;
        }

        /* Sparkle */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Mobile */
        @media (max-width: 380px) {
            .name { font-size: 24px; }
            .verified-glow { width: 22px; height: 22px; }
            .verified-badge svg { width: 12px; height: 12px; }
            .link { padding: 16px 18px; }
            .icon-box { width: 44px; height: 44px; }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .orb, .avatar-ring, .verified-glow::before, .verified-badge, .socialbuzz .icon-box svg, .online-dot::before {
                animation: none;
            }
        }
    </style>
</head>

    </div>

    <script>
        document.querySelectorAll('.link').forEach(link => {
            link.addEventListener('touchstart', () => {}, {passive: true});
            
            link.addEventListener('click', function(e) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = (e.offsetX || 50) + 'px';
                sparkle.style.top = (e.offsetY || 50) + 'px';
                sparkle.style.animation = 'sparkle 0.4s ease';
                this.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 400);
            });
        });
    </script>
</body>
</html>
